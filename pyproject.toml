[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibiomir-lab"
version = "0.1.0"
description = "Configurable multilingual biomedical retrieval experiments for ViBioMIR/R2AI2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
bge = ["FlagEmbedding>=1.3"]
lucene = ["pyserini>=0.44"]
transformers = ["transformers>=4.48", "torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.7"]

[project.scripts]
vibiomir = "vibiomir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

