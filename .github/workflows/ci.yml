name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and the one on the dev laptop.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests and end-to-end smoke test
        # Runs unittest, checks every shell script parses, builds every configs/full factory,
        # then indexes examples/ into a local Qdrant and validates the submission.
        run: bash scripts/smoke_all.sh
